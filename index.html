<style>
/* Layout: telefon önce, tek sütun; altta sabit sekme çubuğu, üstte tazelik şeridi. Kartlar = iş satırı. */
:root{
  --bg:#f3f4f7; --panel:#ffffff; --ink:#18202e; --muted:#5d6676; --line:#dde1e8;
  --accent:#1f5fbf; --accent-ink:#ffffff; --warn:#b4540a; --bad:#b42318; --good:#137a4b; --chip:#e9eef7;
  --display:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141c; --panel:#171e29; --ink:#e7ebf2; --muted:#9aa4b5; --line:#2a3342;
  --accent:#6ea3ff; --accent-ink:#0c1320; --warn:#f0a35c; --bad:#ff7b72; --good:#4fc48a; --chip:#1f2a3b; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f141c; --panel:#171e29; --ink:#e7ebf2; --muted:#9aa4b5; --line:#2a3342;
  --accent:#6ea3ff; --accent-ink:#0c1320; --warn:#f0a35c; --bad:#ff7b72; --good:#4fc48a; --chip:#1f2a3b; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px 8px}
header h1{margin:0;font:700 20px/1.1 var(--display);letter-spacing:.2px}
header .fresh{color:var(--muted);font-size:12px;margin-top:2px}
main{padding:12px 16px 96px;max-width:720px;margin:0 auto;display:grid;gap:14px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding-bottom:env(safe-area-inset-bottom)}
nav[hidden]{display:none}
nav a{padding:10px 2px 12px;text-align:center;color:var(--muted);text-decoration:none;font-weight:600;font-size:12px}
nav a[hidden]{display:none}
nav a[aria-current="page"]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
h2{margin:6px 0 0;font:700 17px/1.2 var(--display);text-wrap:balance;display:flex;gap:8px;align-items:baseline}
h2 .n{font:600 12px var(--body);color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:minmax(0,1fr);gap:6px;min-width:0}
main{grid-template-columns:minmax(0,1fr)}
.card>*,details,details>div>div{min-width:0;max-width:100%}
.m{overflow-wrap:anywhere}
.card.hot{border-left:4px solid var(--warn)}
.card.fsbo{border-left:4px solid var(--good)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.t{font-weight:600;overflow-wrap:anywhere}
.m{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.price{font-variant-numeric:tabular-nums;font-weight:700}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:1px 8px;font-size:12px;font-weight:600;color:var(--ink)}
.chip.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.chip.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.chip.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.btn,button{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 11px;font:600 13px var(--body);text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.btn.pri,button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:disabled{opacity:.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
form.q{display:grid;gap:8px}
input,select,textarea{width:100%;font:15px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
textarea{min-height:84px;resize:vertical}
label{font-size:12px;font-weight:600;color:var(--muted);display:grid;gap:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat b{display:block;font:700 20px var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.msg{padding:12px;border-radius:10px;background:var(--chip);font-size:14px}
.msg.err{background:color-mix(in srgb,var(--bad) 14%,var(--panel));color:var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
details summary{cursor:pointer;font-weight:600}
.empty{color:var(--muted);font-size:14px;padding:4px 2px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.msgbox{white-space:pre-wrap;background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-size:14px}
.ai{border-left:3px solid var(--accent);padding:6px 10px;background:var(--chip);border-radius:6px;font-size:14px}
table.em{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
table.em th,table.em td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}
.tw{overflow-x:auto}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);width:min(520px,94vw);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.45)}
.spin{color:var(--muted);font-size:14px}
button.ipucu{padding:0;width:22px;height:22px;border-radius:50%;justify-content:center;font-size:12px;color:var(--muted);margin-left:auto}
.ipucu-m{font-size:13px}
.ipucu-m[hidden]{display:none}
.piyasa{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.piyasa div{background:var(--panel);border-radius:8px;padding:6px 8px}
.piyasa b{display:block;font:700 17px var(--display)}
.piyasa span{font-size:11.5px;color:var(--muted)}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
#menuBtn{font-size:20px;line-height:1;padding:6px 10px}
#menu{position:fixed;top:52px;right:8px;z-index:7;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);display:grid;min-width:210px;padding:6px}
#menu[hidden]{display:none}
#menu a{padding:10px 12px;color:var(--ink);text-decoration:none;font-weight:600;border-radius:8px}
#menu a:hover{background:var(--chip)}
.btn.ara{background:var(--good);border-color:var(--good);color:#fff;font-size:16px;padding:10px 20px}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>
</head>

    <div class="acts"><button type="submit" class="pri" id="ksave">Kaydet</button><button type="button" id="kclose">Kapat</button></div>
  </form>
</dialog>

<script>

  return ad + '\'' + ('aeıioöuü'.indexOf(son) >= 0 ? (ince ? 'ye' : 'ya') : (ince ? 'e' : 'a')); }
function uyeMi(){ return ROL === 'uye'; }
function kimim(){ return AD === 'Özkan' ? {ad:'Özkan Gün', giris:'Merhaba, ben Özkan Gün, RE/MAX DEHA Ataşehir\'den. ', arayan:'ben'} : {ad:AD, giris:'Merhaba, ben ' + AD + '. ' + (OFIS || 'RE/MAX') + '\'de Özkan Gün\'ün ekibinde çalışıyorum. ', arayan:'Özkan Bey'}; }
function rpc(name, args){
  return sb.rpc(name, args || {}).then(function(r){
    if (r.error) {
      var m = r.error.message || String(r.error);
      if (/JWT|not authenticated|permission denied for function/i.test(m)) { girisEkrani('Oturum süresi doldu, yeniden giriş yap.'); }
      throw new Error(m === 'Bu hesabın yetkisi yok' ? 'Bu e-posta adresinin uygulamaya erişimi yok. Özkan\'a söyle.' : m);
    }
    return r.data;
  });
}

/* ---------- sonuç kaydı ---------- */
var dlg = document.getElementById('dlg'), curRef = null;
function kaydetAc(ref, baslik, phone, name, tur){
  curRef = {ref: ref || '', phone: phone || '', name: name || '', tur: tur || '', arama: /^ara/.test(tur || ''), kaydedildi: false, baslik: baslik || ''};
  document.getElementById('kbaslik').textContent = 'Sonuç kaydet: ' + (baslik || ref || '');
  document.getElementById('kref').textContent = ref ? ('Kayıt: ' + ref) : '';
  ['k_ozet','k_tarih','k_adim','k_neden','k_sonuc'].forEach(function(id){ document.getElementById(id).value = ''; });
  document.getElementById('k_asama_l').hidden = uyeMi();
  document.getElementById('k_kim').value = uyeMi() ? AD : 'Özkan'; document.getElementById('k_kim').disabled = uyeMi();
  document.getElementById('k_kanal').value = /^ara/.test(tur || '') ? 'arama' : 'whatsapp';
  document.getElementById('k_asama').value = '';
  document.getElementById('kres').textContent = '';
  document.getElementById('ksave').disabled = false;
  try { dlg.showModal(); } catch(e) { dlg.setAttribute('open', ''); }
}
document.getElementById('kclose').addEventListener('click', function(){ dlg.close(); });
/* ARA'ya basılıp sonuç girilmeden kutu kapatılırsa arama yine de kaydolur (Pano'da görünsün diye). */
dlg.addEventListener('close', function(){
  var c = curRef; if (!c || !c.arama || c.kaydedildi) return; c.kaydedildi = true;
  rpc('reos_kaydet', {p:{ref:c.ref, phone:c.phone || undefined, name:c.name || undefined, summary:'Arandı (sonuç girilmedi)', channel:'arama', sonuc:'ulasilamadi', tur:c.tur}})
    .then(function(){ if (['#pano','#takip','#sevilay'].indexOf(location.hash) >= 0) route(); }).catch(function(){});
});
document.getElementById('kform').addEventListener('submit', function(ev){
  ev.preventDefault();
  var p = {ref: curRef.ref, phone: curRef.phone, name: curRef.name,
    summary: document.getElementById('k_ozet').value.trim(), stage: document.getElementById('k_asama').value, sonuc: document.getElementById('k_sonuc').value,
    next_date: document.getElementById('k_tarih').value, next_step: document.getElementById('k_adim').value.trim(),
    reason: document.getElementById('k_neden').value.trim(), channel: document.getElementById('k_kanal').value,
    by: document.getElementById('k_kim').value, tur: curRef.tur};
  if (!p.summary && p.sonuc) p.summary = document.getElementById('k_sonuc').selectedOptions[0].textContent;
  if (!p.summary) { document.getElementById('kres').textContent = 'Sonucu seç ya da bir cümleyle anlat (mikrofonla da olur).'; return; }
  Object.keys(p).forEach(function(k){ if (p[k] === '') delete p[k]; });
  var btn = document.getElementById('ksave'); btn.disabled = true; curRef.kaydedildi = true;
  document.getElementById('kres').textContent = 'Kaydediliyor…';
  rpc('reos_kaydet', {p:p}).then(function(r){
    if (uyeMi() && (p.tur === 'cevap' || ['olumlu','randevu','dusunecek'].indexOf(p.sonuc) >= 0))
      bildir('Özkan', 'Sahip cevap verdi', AD + ': ' + (curRef.baslik || '') + ' · "' + (p.summary || '').slice(0, 120) + '"');
    var s = (r && (r.huni || r.id)) ? ('Kaydedildi: ' + (r.huni || r.id) + (r.asama ? ' · ' + r.asama : '') + (r.takip ? ' · sonraki ' + fmtDate(r.takip) : '') + (r.adim ? ' · ' + r.adim : '')) : 'Kaydedildi.';
    if (r && r.yeni_kayit && r.ilan_bulundu === false) s += ' (İlan veritabanında yok; yeni huni kaydı telefon/ad ile açıldı.)';
    document.getElementById('kres').textContent = s;
    setTimeout(function(){ dlg.close(); if (['#pano','#bugun','#huni','#sevilay','#takip',''].indexOf(location.hash) >= 0) route(); }, 1800);
  }).catch(function(e){ btn.disabled = false; curRef.kaydedildi = false; document.getElementById('kres').textContent = 'Kaydedilemedi: ' + e.message; });
});

function gorevKart(t){
  var card = h('div', {cls:'card'}), not = h('textarea', {placeholder:'Not (mikrofonla da söyleyebilirsin). Örn: "ulaşılamıyor", "2 hafta sonra", "konuştum, tamam"', style:'min-height:56px'});
  var res = h('div', {cls:'m'});
  function gonder(islem, btn){ var v = not.value.trim(); if (islem === 'not' && !v) { res.textContent = 'Önce bir not gir.'; return; }
    btn.disabled = true; res.textContent = 'Kaydediliyor…';
    rpc('reos_gorev', {p:{id:t.id, islem:islem, not:v}}).then(function(r){
      res.textContent = r.ok ? r.mesaj : (r.neden || 'Kaydedilemedi');
      if (r.ok && r.durum !== 'Açık') { card.style.opacity = .55; [].forEach.call(card.querySelectorAll('button,textarea'), function(e){ e.disabled = true; }); }
      else btn.disabled = false; }).catch(function(e){ btn.disabled = false; res.textContent = e.message; }); }
  var bK = h('button', {cls:'pri', text:'Kapat'}), bE = h('button', {text:'Ertele'}), bN = h('button', {text:'Notu kaydet'});
  bK.addEventListener('click', function(){ gonder('kapat', bK); });
  bE.addEventListener('click', function(){ gonder('ertele', bE); });
  bN.addEventListener('click', function(){ gonder('not', bN); });
  card.replaceChildren.apply(card, [
    h('div', {cls:'row'}, [chip(t.id), chip(fmtDate(t.tarih) + (t.saat ? ' ' + t.saat : ''), t.tarih < new Date().toISOString().slice(0,10) ? 'bad' : 'warn'), chip(t.durum), t.ad ? chip(t.ad) : null]),
    h('div', {cls:'t', text:t.is}),
    t.not ? h('div', {cls:'m', text:'Son not: ' + t.not}) : null,
    telLinks(t.tel), not,
    h('div', {cls:'m', text:'Notu sistem okur: "ulaşılamıyor / vazgeçti / dönmüyor" kapatır ve görev bir daha çıkmaz; "2 hafta sonra", "yarın" erteler. Ertele\'ye boş basarsan 2 gün sonraya atar.'}),
    h('div', {cls:'acts'}, [bN, bE, bK]), res].filter(Boolean));
  return card;
}

/* ---------- Sevilay listesi ---------- */
function deki(w){
  w = String(w || '').trim(); if (!w) return '';
  if (/(si|sı|su|sü)$/i.test(w)) return w + '\'ndeki';
  if (/(ğı|ğu)$/i.test(w)) return w + '\'ndaki';
  if (/(ği|ğü)$/i.test(w)) return w + '\'ndeki';
  var v = (w.toLowerCase().match(/[aıoueöiü]/g) || ['a']).pop();
  var hard = /[pçtkfhsş]$/i.test(w);
  return w + '\'' + (hard ? 't' : 'd') + ('aıou'.indexOf(v) >= 0 ? 'a' : 'e') + 'ki';
}
function mah(m){ return String(m || '').replace(/ Mahallesi$/i, ''); }
function yerAdi(x){ return x.site ? x.site : mah(x.mahalle); }
function takipMesaj(x){
  var kira = /kiral/i.test(x.tur || ''), yer = deki(yerAdi(x)), ilan = yer + ' ' + (x.oda || '') + ' ' + (kira ? 'kiralık' : 'satılık') + ' ilanınız';
  var ben = kimim();
  if (x.adim === 'ulasamadim') return 'Merhaba, ' + ilan + ' için sizi aradım ama ulaşamadım. Uygun olduğunuz bir saati yazarsanız kısaca arayayım; 2 dakikanızı alır.';
  if (x.adim === 'ara' || x.adim === 'ara2') return 'ARAMA' + (x.adim === 'ara2' ? ' (başka saatte)' : '') + ': "Merhaba, ben ' + ben.ad + ', RE/MAX\'tan. ' + ilan + ' için size ulaşmak istedim. Bir dakikanız var mı?"\n• İlgileniyor / soru soruyor → ' + (ben.arayan === 'ben' ? '"Size kısaca anlatayım, ne zaman uygunsunuz?"' : '"Özkan Bey sizi kısaca arasın, hangi saat uygun olur?"') + '\n• Sattım / kiraladım → "Hayırlı olsun, ileride ihtiyaç olursa numaramız sizde kalsın, iyi günler."\n• Emlakçı istemiyorum → "Anlıyorum, rahatsız etmeyeyim, iyi günler."';
  if (x.adim === 'ikinci_mesaj') return 'Merhaba tekrar, ' + ilan + ' için birkaç gün önce yazmıştım. ' + (kira ? 'Bu bölgede son dönemde dairelerin hangi aralıkta kiralandığını çıkardım; ' : 'Bu mahallede son aylarda gerçekleşen satışların fiyat aralığını çıkardım; ') + 'ilanınızın nerede durduğunu görmek isterseniz kısaca paylaşabilirim. Uygun olur mu?';
  if (x.adim === 'fiyat_dustu') return 'Merhaba tekrar, ' + ilan + 'da fiyatı güncellediğinizi gördüm. Benzer dairelerin son ' + (kira ? 'kiralanma' : 'satış') + ' aralığını paylaşmamı ister misiniz?';
  if (x.adim === 'ilan_kalkti') return 'Merhaba, ' + ilan + ' yayından kalkmış; ' + (kira ? 'kiraladınız mı' : 'sattınız mı') + ', yoksa ara mı verdiniz diye merak ettim. İleride ihtiyaç olursa yardımcı olmaktan memnuniyet duyarız.';
  return '';
}
var ADIM = {ulasamadim:['"aradım, ulaşamadım" mesajı', null], ara2:['başka saatte ARA', 'bad'], ikinci_mesaj:['2. mesaj', null], fiyat_dustu:['fiyatı düştü: yeni fırsat', 'warn'], ilan_kalkti:['ilan kalktı: sor', 'warn'], ara:['ARA (mesaja dönmedi)', 'bad'], birak:['5 deneme: 30 gün beklemeye al', null]};
function fsboMesaj(x){
  var ben = kimim();
  if (x.emlakci_istemez) return ben.giris + 'İlanınızda emlakçıyla çalışmak istemediğinizi gördüm, saygı duyuyorum; yalnızca ' + mah(x.mahalle) + '\'de benzer dairelerin son dönemde hangi fiyatlarla satıldığını derledim. Hiçbir yükümlülük olmadan göndermemi ister misiniz?';
  var kira = /kiral/i.test(x.tur || ''), yer = x.site ? x.site : mah(x.mahalle);
  var s = ben.giris + deki(yer) + ' ' + (x.oda || '') + ' ' + (kira ? 'kiralık' : 'satılık') + ' daire ilanınızı gördüm. ';
  if (kira) s += 'Bu bölgede son dönemde dairelerin hangi aralıkta kiralandığını derleyip size gönderebilirim.';
  else if (x.eski_fiyat) s += 'Bu mahallede benzer ilanların son dönemde hangi fiyatlarda ilgi gördüğünü derleyip size gönderebilirim.';
  else s += 'Mahalledeki benzer ilanların kaç gündür yayında olduğunu ve alıcıların nelere baktığını gösteren kısa bir özet hazırlayabilirim.';
  return s + ' Göndermemi ister misiniz?';
}

function bildir(kime, baslik, metin, url){
  if (!kime || kime === AD) return Promise.resolve();

function b64ToU8(s){ s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; var r = atob(s), u = new Uint8Array(r.length); for (var i = 0; i < r.length; i++) u[i] = r.charCodeAt(i); return u; }

var IOS = /iPhone|iPad|iPod/.test(navigator.userAgent);

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
function bildirimAc(btn, msg){

    if (p !== 'granted') throw new Error('İzin verilmedi. Telefonun Ayarlar → Bildirimler → REOS bölümünden izin ver, sonra tekrar bas.');

  }).then(function(sub){ var j = sub.toJSON(); j.ua = navigator.userAgent.slice(0, 120); return rpc('reos_push_kaydet', {p:j}); })
  .then(function(){ msg.textContent = 'Bildirimler bu telefonda açık.'; btn.remove(); })
  .catch(function(e){ btn.disabled = false; msg.textContent = e.message; });
}
function bildirimKutusu(){
  if (IOS && !STANDALONE) return h('div', {cls:'msg', text:'Telefon bildirimi için: Safari\'de Paylaş → "Ana Ekrana Ekle". Sonra REOS\'u ana ekrandaki simgeden aç; burada "Bildirimleri aç" düğmesi çıkar.'});

  var box = h('div', {cls:'msg', hidden:true}, [msg, h('div', {cls:'acts'}, [btn])]);
  btn.addEventListener('click', function(){ bildirimAc(btn, msg); });
  navigator.serviceWorker.ready.then(function(reg){ return reg.pushManager.getSubscription(); }).then(function(s){
    if (s && Notification.permission === 'granted') { var j = s.toJSON(); j.ua = navigator.userAgent.slice(0, 120); rpc('reos_push_kaydet', {p:j}).catch(function(){}); box.remove(); }
    else box.hidden = false;
  }).catch(function(){ box.hidden = false; });
  setTimeout(function(){ if (box.isConnected && box.hidden && Notification.permission !== 'granted') box.hidden = false; }, 2500);

      return h('tr', null, [h('td', {text:g.gun}), h('td', {text:g.kim}), h('td', {text:String(g.mesaj)}), h('td', {text:String(g.arama)})]); })))])]));

    /* cevap verenler */

    out.push(sec('Cevap verenler', cv.length, 'Son 60 günde ilan sahibinin döndüğü kayıtlar. Kırmızı: Özkan\'ın aranması bekleniyor ve henüz Özkan kaydı yok.'));

        gecmisPanel(c.id)].filter(Boolean)));

    var ak = (d.akis || []).filter(function(a){ return panoFiltre.kim === 'hepsi' || a.kim === panoFiltre.kim; });

        a.id ? gecmisPanel(a.id, 'Geçmiş') : null]));
    });
    if (ak.length) out.push(liste);
    view.replaceChildren.apply(view, out.filter(Boolean));
  }).catch(fail);
}

/* ---------- giriş ---------- */
function girisEkrani(not){
  document.getElementById('nav').hidden = true;
  document.getElementById('fresh').textContent = 'Giriş';
  var em = h('input', {id:'g_email', type:'email', autocomplete:'username', inputmode:'email', placeholder:'e-posta adresin'});
  var pw = h('input', {id:'g_pw', type:'password', autocomplete:'current-password', placeholder:'şifren (en az 8 karakter)'});
  var info = h('div', {cls:'m', text:not || ''});
  function tr(m){ return /Invalid login/i.test(m) ? 'E-posta ya da şifre yanlış. İlk kez giriyorsan "İlk kez giriyorum"a bas.' :
    /already registered/i.test(m) ? 'Bu e-postayla hesap zaten var; "Giriş yap"a bas.' : /Password should be/i.test(m) ? 'Şifre en az 8 karakter olmalı.' : m; }
  function go(yeni){
    var e = em.value.trim(), p = pw.value;
    if (!e || p.length < 8) { info.textContent = 'E-posta ve en az 8 karakterlik şifre gir.'; return; }
    info.textContent = 'Bekle…';
    (yeni ? sb.auth.signUp({email:e, password:p}) : sb.auth.signInWithPassword({email:e, password:p})).then(function(r){
      if (r.error) { info.textContent = tr(r.error.message); return; }
      if (!r.data.session) { info.textContent = 'Hesabın açıldı. Claude onaylayınca (birkaç dakika) aynı e-posta ve şifreyle "Giriş yap"a bas. E-postana gelen onay bağlantısına basmana gerek yok.'; return; }
      basla();
    });
  }
  view.replaceChildren(h('form', {cls:'q', onsubmit:function(ev){ ev.preventDefault(); go(false); }}, [
    sec('Özkan REOS'), h('div', {cls:'m', text:'Yalnız tanımlı e-posta adresleri veriyi görür. İlk kez giriyorsan şifreni kendin belirle ve "İlk kez giriyorum"a bas; sonraki girişlerde "Giriş yap". Telefon şifreyi hatırlar.'}),
    h('label', {'for':'g_email'}, ['E-posta', em]), h('label', {'for':'g_pw'}, ['Şifre', pw]),
    h('div', {cls:'acts'}, [h('button', {cls:'pri', type:'submit', text:'Giriş yap'}), h('button', {type:'button', text:'İlk kez giriyorum', onclick:function(){ go(true); }})]), info]));
}
function cikis(){ sb.auth.signOut().then(function(){ ROL = null; girisEkrani('Çıkış yapıldı.'); }); }

var R = {pano:pano, bugun:bugun, ilan:ilan, ara:ara, huni:huni, kisi:kisi, sevilay:sevilay, takip:takip, protest:protest};
function route(){
  if (!ROL) return;
  var def = 'pano';
  document.getElementById('menu').hidden = true;
  var k = (location.hash || '#' + def).slice(1);
  if (!R[k] || (uyeMi() && ['pano','sevilay','takip','kilavuz'].indexOf(k) < 0)) k = def;
  [].forEach.call(document.querySelectorAll('nav a'), function(a){
    a.hidden = (a.getAttribute('data-r') || '').split(' ').indexOf(ROL) < 0;
    if (a.getAttribute('href') === '#' + k) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  R[k]();
}
function basla(){
  rpc('reos_ben').then(function(b){
    if (!b || !b.rol) { view.replaceChildren(h('div', {cls:'msg err', text:(b && b.email ? b.email : 'Bu hesap') + ' hesabı henüz onaylanmadı. Özkan Claude\'a "onayla" desin, sonra sayfayı yenile.'}), h('div', {cls:'acts'}, [h('button', {text:'Çıkış', onclick:cikis})])); return; }
    ROL = b.rol2 || b.rol; if (ROL === 'sevilay') ROL = 'uye';
    AD = b.ad || ''; OFIS = b.ofis || ''; EKIP = b.ekip || [];
    var ks = document.getElementById('k_kim');
    ks.replaceChildren.apply(ks, (EKIP.length ? EKIP.map(function(e){ return e.ad; }) : [AD || 'Özkan']).map(function(a){ return h('option', {value:a, text:a}); }));
    document.getElementById('nav').hidden = false;
    menuKur();
    var hd = document.getElementById('fresh');
    hd.replaceChildren(document.createTextNode((b.ad || b.email) + ' · s' + SURUM.slice(5) + ' · '), h('a', {href:'#', style:'color:inherit', text:'çıkış', onclick:function(e){ e.preventDefault(); cikis(); }}));
    route();
  }).catch(function(e){ girisEkrani(e.message); });
}
function menuKur(){
  var m = document.getElementById('menu'), b = document.getElementById('menuBtn');
  var items = [ROL === 'ozkan' ? ['#kisi', 'Kişi ara'] : null, ROL === 'ozkan' ? ['#huni', 'Portföy hunisi'] : null,
    ROL === 'ozkan' ? ['#protest', 'sahibinden Pro testi'] : null, ['#kilavuz', 'Kullanım kılavuzu']].filter(Boolean);
  m.replaceChildren.apply(m, items.map(function(x){ return h('a', {href:x[0], text:x[1]}); }).concat([
    h('a', {href:'#', text:'Sayfayı yenile', onclick:function(e){ e.preventDefault(); location.reload(); }}),
    h('a', {href:'#', text:'Çıkış', onclick:function(e){ e.preventDefault(); m.hidden = true; cikis(); }})]));
  b.hidden = false;
  b.onclick = function(){ m.hidden = !m.hidden; b.setAttribute('aria-expanded', String(!m.hidden)); };
  document.addEventListener('click', function(e){ if (!m.hidden && !m.contains(e.target) && e.target !== b) m.hidden = true; });
}
